<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធឯកសាររួម</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kantumruy Pro', sans-serif; margin: 0; background: #f4f7f6; display: flex; flex-direction: column; height: 100vh; }
        .header { background: white; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: space-between; }
        .back-btn { padding: 8px 15px; background: #2c3e50; color: white; text-decoration: none; border-radius: 5px; font-size: 13px; }
        h1 { font-family: 'Moul', serif; color: #d35400; font-size: 16px; margin: 0; }
        .upload-section { background: white; margin: 15px; padding: 20px; border-radius: 10px; border: 2px dashed #f39c12; text-align: center; }
        .upload-btn { background: #f39c12; color: white; padding: 10px 20px; border-radius: 50px; cursor: pointer; display: inline-block; font-weight: bold; }
        .list-area { flex: 1; overflow-y: auto; padding: 15px; }
        .file-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-view { color: #3498db; text-decoration: none; font-weight: bold; margin-right: 15px; }
        .btn-delete { color: #e74c3c; cursor: pointer; font-weight: bold; border: none; background: none; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">⬅ ថយក្រោយ</a>
        <h1>📁 ឯកសារ</h1>
    </div>

    <div class="upload-section">
        <label for="pdfIn" class="upload-btn">➕ បញ្ចូល PDF ទៅ Google Drive</label>
        <input type="file" id="pdfIn" accept="application/pdf" style="display:none;">
        <div id="upStatus" style="font-size: 12px; margin-top: 10px; color: #666;"></div>
    </div>

    <div class="list-area" id="fileListView">
        <p style="text-align:center;">កំពុងទាញទិន្នន័យ...</p>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbztsaSdNN42YRiPxfj0M0Iz3rVmuXf-2oMOC4e45yTiye24FUbH95nUpDXiB8lyc8GFZA/exec';

        // ១. ទាញបញ្ជី File ពី Google Sheets មកបង្ហាញ
        async function loadFiles() {
            const res = await fetch(scriptURL);
            const data = await res.json();
            const view = document.getElementById('fileListView');
            
            if (data.length <= 1) {
                view.innerHTML = "<p style='text-align:center; color:#999;'>មិនទាន់មានឯកសាររួមឡើយ</p>";
                return;
            }

            view.innerHTML = data.slice(1).map((row, index) => `
                <div class="file-card">
                    <span style="font-size:14px; flex:1;">📄 ${row[0]}</span>
                    <div>
                        <a href="${row[1]}" target="_blank" class="btn-view">មើល</a>
                        <span class="btn-delete" onclick="deleteFile(${index + 2})">លុប</span>
                    </div>
                </div>
            `).reverse().join('');
        }

        // ២. មុខងារ Upload ទៅ Google Drive តាមរយៈ Apps Script
        document.getElementById('pdfIn').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const status = document.getElementById('upStatus');
            if (!file) return;

            status.innerHTML = "⏳ កំពុង Upload ទៅ Drive...";
            const reader = new FileReader();
            reader.onload = function(event) {
                fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({
                        name: file.name,
                        file: event.target.result
                    })
                })
                .then(res => res.json())
                .then(response => {
                    status.innerHTML = "✅ Upload ជោគជ័យ!";
                    loadFiles();
                });
            };
            reader.readAsDataURL(file);
        });

        loadFiles();
    </script>
</body>
</html>
