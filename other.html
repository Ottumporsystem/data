<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ការងារផ្សេងៗ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            margin: 0;
            padding-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: url('bg-blurred.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: rgba(255, 255, 255, 0.5);
            background-blend-mode: overlay;
        }

        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .back-btn {
            text-decoration: none;
            color: #d35400;
            font-weight: bold;
            font-size: 16px;
        }

        h1 {
            font-family: 'Moul', serif;
            color: #d35400;
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 280px;
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            color: white !important;
            background-color: #2ecc71 !important;
        }

        .loading-text {
            color: #7f8c8d;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="back-btn">⬅ ត្រឡប់ក្រោយ</a>
    </div>

    <h1>ការងារផ្សេងៗ</h1>

    <!-- ទីតាំងបង្កើតប៊ូតុងដោយស្វ័យប្រវត្តិ -->
    <div class="container" id="buttonContainer">
        <div class="loading-text">កំពុងទាញយកទិន្នន័យ...</div>
    </div>

    <script>
        // 🔗 ដាក់ Web App URL របស់ Apps Script របស់អ្នកត្រង់នេះ
        const fetchURL = 'https://script.google.com/macros/s/AKfycbwqNuNXkDDTnhbMUCX3QzNQohzq7I6_P4PO1ZTdJLau7if2JHA9_mUHCh-SFZ_IRrR7/exec';

        async function loadDynamicButtons() {
            const container = document.getElementById('buttonContainer');
            try {
                const response = await fetch(fetchURL);
                const buttons = await response.json();

                // លុបសារ "កំពុងទាញយកទិន្នន័យ..." ចោល
                container.innerHTML = '';

                // បង្កើតប៊ូតុងតាមចំនួនជួរដែលមានក្នុង Google Sheet
                buttons.forEach(btnData => {
                    const aTag = document.createElement('a');
                    aTag.href = btnData.link;
                    aTag.className = 'btn';
                    aTag.innerText = btnData.name;
                    aTag.target = '_blank'; // បើក Link ក្នុង Tab ថ្មី
                    container.appendChild(aTag);
                });
            } catch (error) {
                container.innerHTML = '<div style="color:red;">មិនអាចទាញយកទិន្នន័យបានទេ!</div>';
            }
        }

        // ដំណើរការពេលបើកទំព័រ
        window.onload = loadDynamicButtons;
    </script>
</body>
</html>
