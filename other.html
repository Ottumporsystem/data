<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ការងារផ្សេងៗ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            margin: 0;
            padding-top: 80px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: url('bg-blurred.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: rgba(255, 255, 255, 0.5);
            background-blend-mode: overlay;
        }

        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .back-btn {
            text-decoration: none;
            color: #d35400;
            font-weight: bold;
            font-size: 16px;
        }

        h1 {
            font-family: 'Moul', serif;
            color: #d35400;
            text-align: center;
            margin-bottom: 25px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 92%;
            max-width: 1000px;
        }

        .column {
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .column-title {
            font-family: 'Moul', serif;
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 2px solid #d35400;
            padding-bottom: 5px;
            width: 100%;
        }

        .btn {
            width: 90%;
            padding: 12px 8px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            color: white !important;
            word-break: break-word;
        }

        /* ថ្នាក់ពណ៌ចម្រុះកំណត់តាម Sheet */
        .blue { background-color: #007bff !important; }
        .red { background-color: #ff4d4d !important; }
        .yellow { background-color: #f1c40f !important; color: #333 !important; }
        .green { background-color: #2ecc71 !important; }
        .purple { background-color: #9b59b6 !important; }
        .orange { background-color: #e67e22 !important; }

        .loading-text {
            grid-column: span 3;
            text-align: center;
            color: #7f8c8d;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="back-btn">⬅ ត្រឡប់ក្រោយ</a>
    </div>

    <h1>ការងារផ្សេងៗ</h1>

    <div class="grid-container" id="gridContainer">
        <div class="loading-text">កំពុងទាញយកទិន្នន័យ...</div>
    </div>

    <script>
        const fetchURL = 'https://script.google.com/macros/s/AKfycbw6XnId-ngwtzSU-qDsdaTt_tLa9pw21Fl5gOVDiU-H1An45a5yXQbRUzNdFA254jZh/exec';

        async function loadDynamicButtons() {
            const container = document.getElementById('gridContainer');
            try {
                const response = await fetch(fetchURL);
                const data = await response.json();

                container.innerHTML = '';

                const categories = [
                    { title: 'ការងារដើមឆ្នាំ', list: data.startYear },
                    { title: 'ការងារឆមាស', list: data.semester },
                    { title: 'ការងារប្រចាំឆ្នាំ', list: data.fullYear }
                ];

                categories.forEach(cat => {
                    const colDiv = document.createElement('div');
                    colDiv.className = 'column';

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'column-title';
                    titleDiv.innerText = cat.title;
                    colDiv.appendChild(titleDiv);

                    if (cat.list && cat.list.length > 0) {
                        cat.list.forEach(btnData => {
                            const aTag = document.createElement('a');
                            aTag.href = btnData.link;
                            
                            // ដាក់ Class ពណ៌តាមទិន្នន័យ Column E ចេញពី Sheet
                            const colorClass = btnData.color || 'green';
                            aTag.className = `btn ${colorClass}`;
                            
                            aTag.innerText = btnData.name;
                            aTag.target = '_blank';
                            colDiv.appendChild(aTag);
                        });
                    } else {
                        const emptyText = document.createElement('span');
                        emptyText.style.color = '#95a5a6';
                        emptyText.style.fontSize = '13px';
                        emptyText.innerText = 'គ្មានទិន្នន័យ';
                        colDiv.appendChild(emptyText);
                    }

                    container.appendChild(colDiv);
                });

            } catch (error) {
                container.innerHTML = '<div class="loading-text" style="color:red;">មិនអាចទាញយកទិន្នន័យបានទេ!</div>';
            }
        }

        window.onload = loadDynamicButtons;
    </script>
</body>
</html>
