<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ផ្ទាំងគ្រប់គ្រង</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Kantumruy Pro', sans-serif;
            background-color: #f8f9fa;
        }

        .header-bar {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 50px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .back-btn {
            text-decoration: none;
            color: #d35400;
            font-weight: bold;
            font-size: 15px;
        }

        /* ផ្ទាំងសម្រាប់ Desktop (iFrame) */
        .desktop-view {
            width: 100%;
            height: calc(100% - 50px);
            margin-top: 50px;
            display: none;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* ផ្ទាំងសម្រាប់ Mobile */
        .mobile-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .mobile-card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 100%;
        }
        .mobile-card h2 {
            font-family: 'Moul', serif;
            color: #d35400;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .mobile-card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .open-sheet-btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background-color: #0F9D58; /* ពណ៌ Google Sheets */
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(15,157,88,0.3);
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="back-btn">⬅ ត្រឡប់ក្រោយ</a>
    </div>

    <!-- បង្ហាញលើ Desktop -->
    <div id="desktopView" class="desktop-view">
        <iframe src="https://docs.google.com/spreadsheets/d/1lLXrnqScWm5MZ7vY8H_4OHO8AiO5zkx0GAp031rJO_Y/edit?usp=sharing"></iframe>
    </div>

    <!-- បង្ហាញលើ Mobile -->
    <div id="mobileView" class="mobile-view">
        <div class="mobile-card">
            <h2>📊 ផ្ទាំងគ្រប់គ្រងទិន្នន័យ</h2>
            <p>ដើម្បីងាយស្រួលក្នុងការកែប្រែទិន្នន័យនៅលើទូរស័ព្ទដៃ សូមចុចប៊ូតុងខាងក្រោមដើម្បីបើកក្នុងកម្មវិធី Google Sheets៖</p>
            <a href="https://docs.google.com/spreadsheets/d/1lLXrnqScWm5MZ7vY8H_4OHO8AiO5zkx0GAp031rJO_Y/edit?usp=sharing" class="open-sheet-btn">
                🟢 បើកក្នុង Google Sheets
            </a>
        </div>
    </div>

    <script>
        // ពិនិត្យមើលថាជា Mobile ឬ Desktop
        function checkDevice() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
            
            if (isMobile) {
                document.getElementById('mobileView').style.display = 'flex';
                document.getElementById('desktopView').style.display = 'none';
            } else {
                document.getElementById('desktopView').style.display = 'block';
                document.getElementById('mobileView').style.display = 'none';
            }
        }

        window.onload = checkDevice;
    </script>
</body>
</html>
