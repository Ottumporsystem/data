<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>បញ្ជីឈ្មោះគ្រូបង្រៀន</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            margin: 0;
            padding-top: 80px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: url('bg-blurred.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: rgba(255, 255, 255, 0.5);
            background-blend-mode: overlay;
        }

        .header-bar {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 60px;
            background: white;
            display: flex; align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .back-btn {
            text-decoration: none;
            color: #d35400;
            font-weight: bold;
            font-size: 16px;
        }

        h1 {
            font-family: 'Moul', serif;
            color: #d35400;
            text-align: center;
            margin-bottom: 25px;
        }

        .table-container {
            width: 95%;
            max-width: 1100px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow-x: auto; /* អនុញ្ញាតឱ្យ Scroll លើទូរស័ព្ទ */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
        }

        th {
            background-color: #2c3e50;
            color: white;
            font-family: 'Kantumruy Pro', sans-serif;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .loading-text {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="back-btn">⬅ ត្រឡប់ក្រោយ</a>
    </div>

    <h1>បញ្ជីឈ្មោះគ្រូបង្រៀន</h1>

    <div class="table-container">
        <div id="loading" class="loading-text">កំពុងទាញយកទិន្នន័យ...</div>
        <table id="teacherTable" style="display: none;">
            <thead id="tableHeader">
                <!-- ក្បាលតារាងបង្កើតដោយស្វ័យប្រវត្តិ -->
            </thead>
            <tbody id="tableBody">
                <!-- ទិន្នន័យជួរបង្កើតដោយស្វ័យប្រវត្តិ -->
            </tbody>
        </table>
    </div>

    <script>
        // ជំនួស URL នៃ Google Apps Script Web App របស់អ្នកត្រង់នេះ
        const fetchURL = 'https://script.google.com/macros/s/AKfycbxeKXIiITnrghTId-z_UyYK3YDWjNRt-Ga_Qp9vCNQHgP13Z0KrLWuqfbcl8zmf-lnq/exec';

        async function loadTeacherData() {
            const loading = document.getElementById('loading');
            const table = document.getElementById('teacherTable');
            const tableHeader = document.getElementById('tableHeader');
            const tableBody = document.getElementById('tableBody');

            try {
                const response = await fetch(fetchURL);
                const data = await response.json();

                // ១. បង្កើតក្បាលតារាង (Headers)
                let headerHTML = '<tr>';
                data.headers.forEach(header => {
                    headerHTML += `<th>${header}</th>`;
                });
                headerHTML += '</tr>';
                tableHeader.innerHTML = headerHTML;

                // ២. បញ្ចូលទិន្នន័យជួរ (Rows)
                let bodyHTML = '';
                if (data.rows.length > 0) {
                    data.rows.forEach(row => {
                        bodyHTML += '<tr>';
                        row.forEach(cell => {
                            bodyHTML += `<td>${cell !== null && cell !== undefined ? cell : ''}</td>`;
                        });
                        bodyHTML += '</tr>';
                    });
                } else {
                    bodyHTML = `<tr><td colspan="${data.headers.length}" style="text-align:center;">គ្មានទិន្នន័យ</td></tr>`;
                }
                tableBody.innerHTML = bodyHTML;

                // បង្ហាញតារាង
                loading.style.display = 'none';
                table.style.display = 'table';

            } catch (error) {
                loading.innerHTML = '<span style="color:red;">មិនអាចទាញយកទិន្នន័យបានទេ! សូមពិនិត្យមើល Web App URL។</span>';
            }
        }

        window.onload = loadTeacherData;
    </script>
</body>
</html>
