<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធទិន្នន័យ</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d35400">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            margin: 0;
            padding-top: 100px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: url('bg-blurred.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: rgba(255, 255, 255, 0.5);
            background-blend-mode: overlay;
        }

        /* --- រចនាប័ទ្ម Navbar --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .menu-icon {
            width: 25px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .menu-icon div {
            width: 100%;
            height: 3px;
            background-color: #333;
            border-radius: 2px;
        }

        /* --- រចនាប័ទ្ម Sidebar --- */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            background-color: #2c3e50; 
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 18px;
            color: #ecf0f1; 
            display: block;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1); 
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #34495e; 
        }

        .sidebar .closebtn {
            position: absolute;
            top: 10px;
            right: 25px;
            font-size: 36px;
            border-bottom: none; 
        }

        /* --- រចនាប័ទ្មប៊ូតុង --- */
        h1 {
            font-family: 'Moul', serif;
            color: #d35400;
            text-align: center;
            margin-bottom: 30px;
        }
        .container { display: flex; flex-direction: column; gap: 15px; }
        .btn {
            width: 280px;
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            color: white !important;
            cursor: pointer;
        }
        .blue { background-color: #007bff !important; }
        .red { background-color: #ff4d4d !important; }
        .yellow { background-color: #f1c40f !important; color: #4b0082 !important; }
        .green { background-color: #2ecc71 !important; }

        /* --- ផ្ទាំង Popup ដំណឹង --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 3000; justify-content: center; align-items: center;
        }
        .modal-box {
            background: white; width: 85%; max-width: 350px; padding: 25px; border-radius: 20px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-box h2 { font-family: 'Moul', serif; color: #d35400; font-size: 18px; margin-top: 0; }
        .modal-box p { font-size: 15px; color: #333; line-height: 1.7; margin: 20px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 15px 0; }
        .close-btn { background: #f39c12; color: white; border: none; padding: 12px 30px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; }

        /* --- ផ្ទាំង Popup លេខកូដសម្ងាត់ (Password Modal) --- */
        .pwd-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 4000;
            justify-content: center;
            align-items: center;
        }

        .pwd-modal-box {
            background: white;
            width: 85%;
            max-width: 340px;
            padding: 25px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: pwdPopIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pwdPopIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .pwd-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .pwd-modal-box h3 {
            font-family: 'Moul', serif;
            color: #d35400;
            font-size: 16px;
            margin: 0 0 10px 0;
        }

        .pwd-modal-box p {
            font-size: 13px;
            color: #555;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        /* ប្រអប់ wrapper សម្រាប់ដាក់ Input និង Icon ភ្នែក */
        .pwd-input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .pwd-input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            text-align: center;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .pwd-input:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0,123,255,0.25);
        }

        .toggle-pwd-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            user-select: none;
            opacity: 0.6;
            transition: 0.2s;
        }

        .toggle-pwd-btn:hover {
            opacity: 1;
        }

        .pwd-btn-group {
            display: flex;
            gap: 10px;
        }

        .pwd-btn {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .pwd-btn-submit {
            background: #007bff;
            color: white;
        }

        .pwd-btn-submit:hover {
            background: #0056b3;
        }

        .pwd-btn-cancel {
            background: #e0e0e0;
            color: #333;
        }

        .pwd-btn-cancel:hover {
            background: #d4d4d4;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="menu-icon" onclick="openNav()">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <span style="margin-left: 20px; font-weight: bold; color: #333;">Data System</span>
    </div>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="document.html">ឯកសារភ្ជាប់ PDF</a>
        <a href="teacher.html">គ្រូបង្រៀន</a>
        <a href="#">ថ្នាក់</a>
        <a href="https://docs.google.com/spreadsheets/d/1Js9S4F0SZn1pzwgjznk-ze8fWmDRy_HkmVKgnBDdOnE/edit?gid=393522210#gid=393522210">សិស្ស</a>
        <a href="javascript:void(0)" onclick="closeNav(); checkAnnouncement(true);">សេចក្ដីជូនដំណឹង</a>
        <a href="javascript:void(0)" id="installBtn" style="display:none; color: #f1c40f;">📥 ដំឡើងកម្មវិធី</a>
    </div>

    <h1>ប្រព័ន្ធទិន្នន័យ</h1>

    <div class="container">
        <a href="javascript:void(0)" onclick="openAdminSheet()" class="btn blue">ផ្ទាំងគ្រប់គ្រង</a>
        <a href="https://docs.google.com/spreadsheets/u/0/d/1tGn2xgAk-zKGIrPA4lyDw1ssVu57e22t4UJkcqTnKxQ/edit" class="btn red">អត្តលេខសិស្ស</a>
        <a href="https://docs.google.com/spreadsheets/d/1PnwL3ZsdLLCKjK5jm9MwPw0Du35MfOXMd1qELAdPIb0/edit?usp=drivesdk" class="btn yellow">របាយការណ៍ស្ដង់ដាគំរូ</a>
        <a href="other.html" class="btn green">ការងារផ្សេងៗ</a>
    </div>

    <!-- ផ្ទាំង Popup ដំណឹង -->
    <div id="announcementModal" class="modal-overlay">
        <div class="modal-box">
            <h2>📢 ដំណឹងថ្មីៗ!</h2>
            <p id="noteMessage">កំពុងទាញយកដំណឹង...</p>
            <button class="close-btn" onclick="closeModal()">យល់ព្រម / ទទួលជ្រាប</button>
        </div>
    </div>

    <!-- ផ្ទាំង Popup វាយបញ្ចូលលេខកូដសម្ងាត់ (មាន Icon ភ្នែកមើល/លាក់ Password) -->
    <div id="passwordModal" class="pwd-modal-overlay">
        <div class="pwd-modal-box">
            <div class="pwd-icon">🔒</div>
            <h3>ការការពារសុវត្ថិភាព</h3>
            <p>សូមវាយបញ្ចូលលេខកូដសម្ងាត់ដើម្បីចូលទៅកាន់ផ្ទាំងគ្រប់គ្រង</p>
            
            <div class="pwd-input-wrapper">
                <input type="password" id="adminPwdInput" class="pwd-input" placeholder="បញ្ចូលលេខកូដទីនេះ..." onkeydown="if(event.key==='Enter') submitPassword()">
                <span class="toggle-pwd-btn" onclick="togglePasswordVisibility()">👁️</span>
            </div>

            <div class="pwd-btn-group">
                <button class="pwd-btn pwd-btn-cancel" onclick="closePwdModal()">បោះបង់</button>
                <button class="pwd-btn pwd-btn-submit" onclick="submitPassword()">បញ្ជូន</button>
            </div>
        </div>
    </div>

    <script>
        // --- ផ្នែកទី ១៖ PWA Configuration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker បានចុះឈ្មោះ!'))
                .catch(err => console.log('ចុះឈ្មោះបរាជ័យ:', err));
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'block';
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBtn').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // --- ផ្នែកទី ២៖ App Functions ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyRYSYSlF0ThVlX_TsQSe52_GhhLNez2ceDLAYaBT_uNtBMkCEIA-6StvvZfo3hOSCL9Q/exec';

        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
        }
        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }

        // --- មុខងារផ្ទាំង Popup លេខកូដសម្ងាត់ ---
        function openAdminSheet() {
            const pwdInput = document.getElementById('adminPwdInput');
            pwdInput.value = '';
            pwdInput.type = 'password'; // កំណត់ទៅជាលាក់វិញរាល់ពេលបើកដំបូង
            document.getElementById('passwordModal').style.display = 'flex';
            setTimeout(() => {
                pwdInput.focus();
            }, 100);
        }

        function closePwdModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        // មុខងារ បិទ/បើក មើលលេខកូដសម្ងាត់
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('adminPwdInput');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
            } else {
                pwdInput.type = 'password';
            }
        }

        function submitPassword() {
            const pwd = document.getElementById('adminPwdInput').value;
            if (pwd === "School@123") {
                closePwdModal();
                window.location.href = "https://docs.google.com/spreadsheets/d/1lLXrnqScWm5MZ7vY8H_4OHO8AiO5zkx0GAp031rJO_Y/edit?usp=sharing";
    } else {
                alert("លេខកូដសម្ងាត់មិនត្រឹមត្រូវទេ! សូមសាកល្បងម្ដងទៀត។");
            }
        }

        async function checkAnnouncement(forceShow = false) {
            try {
                const res = await fetch(scriptURL);
                const data = await res.json();
                if (data.announcement && data.announcement.status === "ON") {
                    const currentMsg = data.announcement.msg;
                    if (forceShow || localStorage.getItem('readNotice') !== currentMsg) {
                        document.getElementById('noteMessage').innerText = currentMsg;
                        document.getElementById('announcementModal').style.display = 'flex';
                    }
                } else if (forceShow) {
                    alert("មិនទាន់មានដំណឹងថ្មីនៅឡើយទេ");
                }
            } catch (e) {
                console.log("Error fetching announcement");
            }
        }

        function closeModal() {
            const currentMsg = document.getElementById('noteMessage').innerText;
            localStorage.setItem('readNotice', currentMsg);
            document.getElementById('announcementModal').style.display = 'none';
        }

        window.onload = function() {
            checkAnnouncement();
        };
    </script>

</body>
</html>
