<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធទិន្នន័យ</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d35400">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Moul&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            margin: 0;
            padding-top: 100px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: url('bg-blurred.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: rgba(255, 255, 255, 0.5);
            background-blend-mode: overlay;
        }

        /* --- រចនាប័ទ្ម Navbar --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .menu-icon {
            width: 25px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .menu-icon div {
            width: 100%;
            height: 3px;
            background-color: #333;
            border-radius: 2px;
        }

        /* --- រចនាប័ទ្ម Sidebar --- */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            background-color: #2c3e50; 
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 18px;
            color: #ecf0f1; 
            display: block;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1); 
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #34495e; 
        }

        .sidebar .closebtn {
            position: absolute;
            top: 10px;
            right: 25px;
            font-size: 36px;
            border-bottom: none; 
        }

        /* --- រចនាប័ទ្មប៊ូតុង --- */
        h1 {
            font-family: 'Moul', serif;
            color: #d35400;
            text-align: center;
            margin-bottom: 30px;
        }
        .container { display: flex; flex-direction: column; gap: 15px; }
        .btn {
            width: 280px;
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            color: white !important;
        }
        .blue { background-color: #007bff !important; }
        .red { background-color: #ff4d4d !important; }
        .yellow { background-color: #f1c40f !important; color: #4b0082 !important; }

        /* --- ផ្ទាំង Popup ដំណឹង --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 3000; justify-content: center; align-items: center;
        }
        .modal-box {
            background: white; width: 85%; max-width: 350px; padding: 25px; border-radius: 20px;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-box h2 { font-family: 'Moul', serif; color: #d35400; font-size: 18px; margin-top: 0; }
        .modal-box p { font-size: 15px; color: #333; line-height: 1.7; margin: 20px 0; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 15px 0; }
        .close-btn { background: #f39c12; color: white; border: none; padding: 12px 30px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="menu-icon" onclick="openNav()">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <span style="margin-left: 20px; font-weight: bold; color: #333;">Data System</span>
    </div>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="document.html">ឯកសារភ្ជាប់ PDF</a>
        <a href="teacher.html">គ្រូបង្រៀន</a>
        <a href="#">ថ្នាក់</a>
        <a href="https://docs.google.com/spreadsheets/d/1Js9S4F0SZn1pzwgjznk-ze8fWmDRy_HkmVKgnBDdOnE/edit?gid=393522210#gid=393522210">សិស្ស</a>
        <a href="javascript:void(0)" onclick="closeNav(); checkAnnouncement(true);">សេចក្ដីជូនដំណឹង</a>
        <a href="javascript:void(0)" id="installBtn" style="display:none; color: #f1c40f;">📥 ដំឡើងកម្មវិធី</a>
    </div>

    <h1>ប្រព័ន្ធទិន្នន័យ</h1>

    <div class="container">
        <a href="https://docs.google.com/spreadsheets/d/1afgroyCJS3lyFvee03zl2uGAsKHhO2PNJSKrb_Rguvs/edit?usp=sharing" class="btn blue">សិស្សធ្វើកិច្ចការស្រាវជ្រាវ</a>
        <a href="https://docs.google.com/spreadsheets/u/0/d/1tGn2xgAk-zKGIrPA4lyDw1ssVu57e22t4UJkcqTnKxQ/edit" class="btn red">អត្តលេខសិស្ស</a>
        <a href="https://docs.google.com/spreadsheets/d/1PnwL3ZsdLLCKjK5jm9MwPw0Du35MfOXMd1qELAdPIb0/edit?usp=drivesdk" class="btn yellow">របាយការណ៍ស្ដង់ដាគំរូ</a>
        <a href="#" class="btn pink">ការងារផ្សេងៗ</a>
    </div>

    <div id="announcementModal" class="modal-overlay">
        <div class="modal-box">
            <h2>📢 ដំណឹងថ្មីៗ!</h2>
            <p id="noteMessage">កំពុងទាញយកដំណឹង...</p>
            <button class="close-btn" onclick="closeModal()">យល់ព្រម / ទទួលជ្រាប</button>
        </div>
    </div>

    <script>
        // --- ផ្នែកទី ១៖ PWA Configuration ---
        // ចុះឈ្មោះ Service Worker (sw.js)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker បានចុះឈ្មោះ!'))
                .catch(err => console.log('ចុះឈ្មោះបរាជ័យ:', err));
            });
        }

        // មុខងារដំឡើងកម្មវិធី (Install Prompt)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'block';
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBtn').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // --- ផ្នែកទី ២៖ App Functions ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyRYSYSlF0ThVlX_TsQSe52_GhhLNez2ceDLAYaBT_uNtBMkCEIA-6StvvZfo3hOSCL9Q/exec';

        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
        }
        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }

        async function checkAnnouncement(forceShow = false) {
            try {
                const res = await fetch(scriptURL);
                const data = await res.json();
                if (data.announcement && data.announcement.status === "ON") {
                    const currentMsg = data.announcement.msg;
                    if (forceShow || localStorage.getItem('readNotice') !== currentMsg) {
                        document.getElementById('noteMessage').innerText = currentMsg;
                        document.getElementById('announcementModal').style.display = 'flex';
                    }
                } else if (forceShow) {
                    alert("មិនទាន់មានដំណឹងថ្មីនៅឡើយទេ");
                }
            } catch (e) {
                console.log("Error fetching announcement");
            }
        }

        function closeModal() {
            const currentMsg = document.getElementById('noteMessage').innerText;
            localStorage.setItem('readNotice', currentMsg);
            document.getElementById('announcementModal').style.display = 'none';
        }

        window.onload = function() {
            checkAnnouncement();
        };
    </script>

</body>
</html>
